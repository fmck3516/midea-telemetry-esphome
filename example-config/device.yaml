esphome:
  name: midea-telemetry

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: arduino

wifi:
  ap:
    ssid: "midea-telemetry-esphome"
    password: "midea-telemetry-esphome"

captive_portal:    

web_server:
  port: 80

api:
logger:
ota:
  platform: esphome

external_components:
  - source: ../components   # local checkout; from elsewhere use:
    components: [midea_telemetry]   # - source: github://fmck3516/midea-telemetry-esphome

midea_telemetry:
  clk_pin: GPIO3   # D2 on the XIAO ESP32S3
  dat_pin: GPIO2   # D1
  update_interval: 10s
  # Serve all mapped parameters and the raw response frames as JSON at
  # http://<device>/json (needs web_server: below). Handy for reverse
  # engineering without streaming everything to Home Assistant as sensors.
  expose_json_endpoint: true

sensor:
  - platform: midea_telemetry
    indoor_ambient_temperature:
      name: Indoor ambient temperature
    indoor_coil_temperature:
      name: Indoor coil temperature
    outdoor_ambient_temperature:
      name: Outdoor ambient temperature
    outdoor_coil_temperature:
      name: Outdoor coil temperature
    discharge_temperature:
      name: Compressor discharge temperature
    ipm_temperature:
      name: IPM temperature
    operating_mode:
      name: Operating mode
    compressor_frequency_target:
      name: Compressor frequency (target)
    compressor_frequency_actual:
      name: Compressor frequency (actual)
    outdoor_fan_speed:
      name: Outdoor fan speed
    eev_steps:
      name: EEV opening steps
    indoor_setpoint:
      name: Indoor set-point
    input_voltage:
      name: Input voltage
    current_draw:
      name: Current draw
    dc_bus_voltage:
      name: DC bus voltage
